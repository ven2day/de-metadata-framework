version: 2

sources:
  - name: de_bronze
    description: "Bronze Iceberg tables written by the Spark ingestion pipeline"
    database: "{{ env_var('ICEBERG_CATALOG', 'minio') }}"
    schema: "{{ env_var('BRONZE_DATABASE', 'de_bronze') }}"
    tables:
      - name: bronze_table
        description: >
          Replace this with your actual bronze table name.
          Table names match the application_name used in the ingestion job.
