de_transformation:
  target: dev
  outputs:
    dev:
      type:     trino
      method:   none
      host:     "{{ env_var('TRINO_HOST', 'localhost') }}"
      port:     "{{ env_var('TRINO_PORT', '8081') | int }}"
      user:     dbt
      database: "{{ env_var('ICEBERG_CATALOG', 'minio') }}"
      schema:   "{{ env_var('SILVER_DATABASE', 'de_silver') }}"
      threads:  4
    docker:
      type:     trino
      method:   none
      host:     trino
      port:     8080
      user:     dbt
      database: "{{ env_var('ICEBERG_CATALOG', 'minio') }}"
      schema:   "{{ env_var('SILVER_DATABASE', 'de_silver') }}"
      threads:  4
