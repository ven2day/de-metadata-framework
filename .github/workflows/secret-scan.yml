name: Secret protection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test local secret guard
        run: node --test tests/local_secrets.test.js
      - name: Scan current files and complete history
        shell: pwsh
        run: ./scripts/check-publish.ps1 -AllowMissingEnv
