      .layerTitle { font-size: 31px; font-weight: 750; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 21px; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .externalFlow { fill: none; stroke: #b7791f; stroke-width: 2.5; stroke-dasharray: 7 7; stroke-linejoin: round; marker-end: url(#externalArrow); }
