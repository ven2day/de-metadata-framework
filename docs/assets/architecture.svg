  <text x="58" y="112" style="font-size:21px;fill:#c8d8ee">NSE data pipeline · four local layers · one open lakehouse</text>
  <rect x="1090" y="53" width="294" height="43" rx="21.5" fill="#214d66" stroke="#67c9b9"/>
