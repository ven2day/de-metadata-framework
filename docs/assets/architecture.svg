  <text x="58" y="234" class="body muted">Storage and compute are local.</text>
  <text x="58" y="261" class="small muted">No Oracle database required.</text>

  <text x="470" y="164" class="label" style="fill:#96611c">EXTERNAL DATA SOURCE</text>
  <rect x="450" y="179" width="550" height="105" rx="15" fill="#fff8e9" stroke="#dfb875" stroke-width="1.5"/>
