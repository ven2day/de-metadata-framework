  <text x="890" y="707" class="mono">de_silver</text>
  <text x="890" y="742" class="small muted">dbt + Trino transforms</text>
  <text x="890" y="771" class="small muted">Business logic + MERGE</text>

  <path d="M 1114 710 H 1132" class="flow"/>
