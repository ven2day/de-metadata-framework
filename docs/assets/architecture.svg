<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title description">
  <title id="title">DE Metadata Framework: Docker-local NSE data architecture</title>
  <desc id="description">Dhan is an external authenticated market-data source. REST snapshots enter the on-demand Spark runner directly. WebSocket events enter an opt-in collector with a local spool and land as JSONL micro-batches on MinIO. Separately scheduled ingestion of closed UTC minutes feeds Spark. Metadata validation, type casting, and optional PII processing produce Lake tables in de_lake. Spark deduplication produces Bronze in de_bronze. dbt and Trino produce Silver in de_silver. The local gold-load publisher uses Trino to atomically publish Gold in de_gold. All four are logical Iceberg namespaces on shared local MinIO storage, using Parquet. Hive Metastore uses PostgreSQL 15; the Flask application and scheduler use PostgreSQL 16. Vault provides KV v2 and Transit. Trino queries all layers; the UI SQL console uses Spark SQL. OpenAI and Cloudflare are optional. No Oracle database or cloud warehouse is required. This diagram describes the default topology, not a live connection status.</desc>
