# ============================================================
# log4j2 — suppress all Spark/JVM logs from stdout
# Project output comes through Python logging (stdout only).
# Any remaining JVM-level errors go to stderr.
# ============================================================

status = error

# ── Root logger ───────────────────────────────────────────────
rootLogger.level = error
rootLogger.appenderRef.stderr.ref = stderr

# ── Stderr appender (JVM errors only — not stdout) ────────────
appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{yyyy-MM-dd HH:mm:ss}  %-5level  %logger — %msg%n

# ── Silence all known Spark / Hadoop / Iceberg internals ──────
logger.spark.name = org.apache.spark
logger.spark.level = off

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = off

logger.hive.name = org.apache.hive
logger.hive.level = off

logger.parquet.name = org.apache.parquet
logger.parquet.level = off

logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = off

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = off

logger.netty.name = io.netty
logger.netty.level = off

logger.aws.name = com.amazonaws
logger.aws.level = off

logger.awssdk.name = software.amazon
logger.awssdk.level = off

logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = off
