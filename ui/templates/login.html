<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DE Metadata Pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f7f7f8;
      --surface:  #ffffff;
      --border:   #e2e2e5;
      --text:     #1a1a1a;
      --muted:    #6b7280;
      --accent:   #2563eb;
      --accent-h: #1d4ed8;
      --red:      #dc2626;
      --radius:   6px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-wrap { width: 100%; max-width: 360px; }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .brand h1 span { color: var(--accent); }
    .brand p { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }

    input[type="text"],
    input[type="password"] {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px; font-family: inherit;
      color: var(--text); background: var(--surface);
      outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 12px;
      color: var(--red);
      margin-bottom: 16px;
    }

    .btn-submit {
      width: 100%; padding: 10px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
      margin-top: 4px;
    }
    .btn-submit:hover { background: var(--accent-h); }
  </style>
</head>
<body>
<div class="login-wrap">

  <div class="brand">
    <h1>DE Metadata <span>Pipeline</span></h1>
    <p>Sign in to continue</p>
  </div>

  <div class="card">
    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" autofocus required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn-submit">Sign in</button>
    </form>
  </div>

</div>
</body>
</html>
